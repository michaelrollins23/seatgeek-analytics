version: 2

models:
  - name: fct_ticket_sales
    description: "The grain of this table is one row per successful ticket sale."
    columns:
      - name: sale_id
        description: "Primary key for the sale"
        tests:
          - unique
          - not_null
      - name: days_until_event
        description: "The lead time in days between the purchase and event date."
        tests:
          - dbt_utils.accpeted_range:
              arguments: 
                min_value: 0

  - name: dm_event_performance
    description: "The summary table sued for executive reporting to compare revenue across different event types"
    columns:
      - name: event_type
        description: "The category of the event (eg., NFL, Concert)"
        tests:
          - not_null
      - name: avg_booking_window_days
        description: "The average number of days fans buy tickets in advance"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "avg_booking_window_days >= 0"